<body>

    <div id="wordcloudDiv">
    </div>

    <div id="map" class="map">
    </div>

    <!--OS attribute logo-->
    <script src="https://cdn.jsdelivr.net/gh/OrdnanceSurvey/os-api-branding@0.3.1/os-api-branding.js"></script>

    <script>

    // Leaflet

	// OS Data Hub API Key
	const apiKey = 'hY9nIzYSGV9A9kaF8ScWbl7wghXs6P6j';

    // initialize the map.
    const mapOptions = {
        minZoom: 7,
        maxZoom: 20,
        center: [ 56.2, -3.7 ],
        zoom: 8,
        maxBounds: [
            [ 49.528423, -10.76418 ],
            [ 61.331151, 1.9134116 ]
        ],
    };

	const map = L.map('map', mapOptions);

	// load and display OS ZXY tile layer on the map
	url = "https://api.os.uk/maps/raster/v1/zxy/Light_3857/{z}/{x}/{y}.png?key=" + apiKey;
	const basemap = L.tileLayer(url, {
        maxZoom: 20
    }).addTo(map);

    L.control.scale({position:'bottomleft'}).addTo(map);
    
    //Load ORN rivers data and display on map
    L.geoJSON(ornRiversGeoJSONData).addTo(map);

    // add catchment hexagon river data and add click/mouseover function to update wordcloud
    L.geoJSON(riversHexGeoJSONData, {
        opacity: 0,
        fillOpacity: 0,
        //transparent: true,
        onEachFeature: function (feature, layer) {
            layer.on('mouseover', function (e) {
            //layer.on('click', function (e) {
                drawUpdate(feature.properties.rivers);
            });
        }
    }).addTo(map);

    // read catchment names from data
    let catNamesArr = [];
    L.geoJSON(riversHexGeoJSONData).eachLayer(function (layer) {
        catNamesArr.push(layer.feature.properties.rivers);
    });
    // get unique values from data
    let uniqueCatNamesSet = new Set(catNamesArr);
    let uniqueCatNames = [...uniqueCatNamesSet];
    //remove null values
    let uniqueCatNamesFiltered = uniqueCatNames.filter(function (el) {
        return el != null;
    });

    // function to create and update D3 wordcloud
    function drawUpdate(newWords){
        // remove old words
        d3.select("#wordcloudDiv")
            .selectAll("text")
            .data([]) // Pass an empty array to bind no data
            .exit()
            .remove(); // Removes all existing text elements
        d3.select("#wordcloudDiv").select("svg").remove();

        // split data value string into array with delimiter
        let riversCloudArray = newWords.split(";");
        // get min and max values
        let riversCloudArrayNumbers = riversCloudArray.map(function(num) { return num.substring(num.indexOf("=") + 1 )});
        const riversCloudArrayMax = Math.max.apply(Math, riversCloudArrayNumbers);
        const riversCloudArrayMin = Math.min.apply(Math, riversCloudArrayNumbers);

        // define a scale to map weights to font sizes
        const fontSizeScale = d3.scale.linear()
            .domain([riversCloudArrayMin, riversCloudArrayMax])
            //.range([15, 40]); // Minimum and maximum font sizes in pixels
            .range([(riversCloudArrayMin != riversCloudArrayMax ? 10 : 35), 35]); // Minimum and maximum font sizes in pixels, if one river use only highest value
            //.range([((riversCloudArrayMin != riversCloudArrayMax) && (window.innerWidth) < 1000 ? 10 : 35), (window.innerWidth < 1000 ? 35 : 45)]); // Minimum and maximum font sizes in pixels, if one river use only highest value, if browser width > 1000 increase and shift range

        // build wordcloud
        var layout = d3.layout.cloud()
        .size([
            Math.min(500, document.getElementById("wordcloudDiv").clientWidth - 20),
            window.innerWidth < 1000 ? 180 : 300
        ])
        .words(riversCloudArray.map(d => ({ text: d.substring(0, d.indexOf("=")), size: fontSizeScale(d.substring(d.indexOf("=") + 1 )) })))
        .padding(5)
        .rotate(function() { return 0; })
        .fontSize(function(d) { return d.size; })
        . on("end", draw);

        layout.start();

        function draw(words) {
            d3.select("#wordcloudDiv").append("svg")
            .attr("width", "100%")
            .attr("height", layout.size()[1])
            .attr("viewBox", `0 0 ${layout.size()[0]} ${layout.size()[1]}`)
            .append("g")
            .attr("transform", `translate(${layout.size()[0]/2},${layout.size()[1]/2})`)
            .selectAll("text")
            .data(words)
            .enter().append("text")
            .style("font-size", function(d) { return d.size + "px"; })
            .style("fill", "#69b3a2")
            .attr("text-anchor", "middle")
            .attr("transform", function(d) { return "translate(" + [d.x, d.y] + ")rotate(" + d.rotate + ")"; })
            .text(function(d) { return d.text; });
        }
    }

    </script>

</body>
