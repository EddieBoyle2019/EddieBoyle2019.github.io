<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F2O Rivers and Word Cloud</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="rivers_wc_bootstrap.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://d3js.org/d3.v3.min.js"></script>
<script src="d3.layout.cloud.js"></script>
<script src="rivers_hex_ll.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="logo.png" height="48" class="me-2">
      <span>F2O Rivers & Word Cloud</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/">Explore</a></li>
        <li class="nav-item"><a class="nav-link" href="/">Insights</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid py-3">
  <div class="row g-3">
    
    <div class="col-lg-4">
      <div class="card shadow-sm h-100">
        <!--<div class="card-header fw-bold">River Word Cloud</div>-->
        <div class="card-body">
          <div id="wordcloudDiv"></div>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card shadow-sm">
        <!--<div class="card-header fw-bold">Map</div>-->
        <div class="card-body p-0">
          <div id="map"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const apiKey='hY9nIzYSGV9A9kaF8ScWbl7wghXs6P6j';

const map=L.map('map',{
center:[56.1,-3.8],
zoom:9,
minZoom:7,
maxZoom:20
});

L.tileLayer(
"https://api.os.uk/maps/raster/v1/zxy/Light_3857/{z}/{x}/{y}.png?key="+apiKey,
{maxZoom:20}
).addTo(map);

function drawUpdate(newWords){
 d3.select("#wordcloudDiv").select("svg").remove();

 let arr=newWords.split(";");
 let nums=arr.map(d=>+d.substring(d.indexOf("=")+1));
 let max=Math.max.apply(Math,nums);
 let min=Math.min.apply(Math,nums);

 let w=document.getElementById("wordcloudDiv").clientWidth;
 let h=300;

 let scale=d3.scale.linear().domain([min,max]).range([16,56]);

 var layout=d3.layout.cloud()
 .size([w,h])
 .words(arr.map(d=>({
   text:d.substring(0,d.indexOf("=")),
   size:scale(d.substring(d.indexOf("=")+1))
 })))
 .padding(5)
 .rotate(()=>0)
 .fontSize(d=>d.size)
 .on("end",draw);

 layout.start();

 function draw(words){
   d3.select("#wordcloudDiv")
   .append("svg")
   .attr("width","100%")
   .attr("height",h)
   .attr("viewBox",`0 0 ${w} ${h}`)
   .append("g")
   .attr("transform",`translate(${w/2},${h/2})`)
   .selectAll("text")
   .data(words)
   .enter()
   .append("text")
   .style("font-size",d=>d.size+"px")
   .style("fill","#1799cb")
   .attr("text-anchor","middle")
   .attr("transform",d=>"translate("+[d.x,d.y]+")")
   .text(d=>d.text);
 }
}

L.geoJSON(riversHexGeoJSONData,{
 onEachFeature:function(feature,layer){
   layer.on('mouseover',function(){
     drawUpdate(feature.properties.rivers);
   });
 }
}).addTo(map);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
