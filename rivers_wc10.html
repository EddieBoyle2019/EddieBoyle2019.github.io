function drawUpdate(newWords){
    //alert("Feature clicked: " + newWords);

//Remove old words
d3.select("#wordcloudDiv")
  .selectAll("text")
  .data([]) // Pass an empty array to bind no data
  .exit()
  .remove(); // Removes all existing text elements

//d3.select("#wordcloudDiv").svg.remove();
d3.select("#wordcloudDiv").select("svg").remove();

    let riversCloudArray = newWords.split(";");
    //get min and max values
    let riversCloudArrayNumbers = riversCloudArray.map(function(num) { return num.substring(num.indexOf("=") + 1 )});
    const riversCloudArrayMax = Math.max.apply(Math, riversCloudArrayNumbers);
    const riversCloudArrayMin = Math.min.apply(Math, riversCloudArrayNumbers);


    //alert("Min: " + riversCloudArrayMin + "; Max: " + riversCloudArrayMax);

    //function normNum(numValue)
    //{
        //if (riversCloudArrayMax == riversCloudArrayMin)
        //{
        //    let normNumValue = 1;
            //let normNumValue = 0 +  ((numValue - riversCloudArrayMin) * (1-0)) / (riversCloudArrayMax - riversCloudArrayMin);
        //                alert(normNumValue);
        //}
        //else
        //{
            //let normNumValue = 1;
            //let normNumValue = 0 +  ((numValue - riversCloudArrayMin) * (1-0)) / (riversCloudArrayMax - riversCloudArrayMin);
                        //alert(normNumValue);
        //}

        //return normNumValue;
    //} 

//normalized_value = range_min + ((value - original_min) * (range_max - range_min)) / (original_max - original_min)

// 2. Define a scale to map weights to font sizes
const fontSizeScale = d3.scale.linear()
  .domain([riversCloudArrayMin, riversCloudArrayMax])
  .range([20, 60]); // Minimum and maximum font sizes in pixels

        var layout = d3.layout.cloud()
        .size([500, 400])
        //.words(riversCloudArray.map(function(d) { return {text: d, size: 10 + Math.random() * 50}; }))
        //.words(riversCloudArray.map(function(d) { return {text: d.substring(0, d.indexOf("=")), size: 10 + Math.random() * 50}; }))
        //.words(riversCloudArray.map(function(d) { return {text: d.substring(0, d.indexOf("=")), size: d.substring(d.indexOf("=") + 1 )}; }))
        .words(riversCloudArray.map(d => ({ text: d.substring(0, d.indexOf("=")), size: fontSizeScale(d.substring(d.indexOf("=") + 1 )) })))
        //.words(riversCloudArray.map(function(d) { return {text: d.substring(0, d.indexOf("=")), size: 10 + normNum(d.substring(d.indexOf("=") + 1 )) * 50 }; }))
        .padding(5)
        .rotate(function() { return 0; })
        .fontSize(function(d) { return d.size; })
        . on("end", draw);
    layout.start();

    function draw(words) {
    d3.select("#wordcloudDiv").append("svg")
        .attr("width", layout.size()[0])
        .attr("height", layout.size()[1])
        .append("g")
        .attr("transform", "translate(255,200)")
        .selectAll("text")
        .data(words)
        .enter().append("text")
        .style("font-size", function(d) { return d.size + "px"; })
        .style("fill", "#69b3a2")
        .attr("text-anchor", "middle")
        .attr("transform", function(d) { return "translate(" + [d.x, d.y] + ")rotate(" + d.rotate + ")"; })
        .text(function(d) { return d.text; });
    }
}
